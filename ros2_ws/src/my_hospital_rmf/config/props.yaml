# Gazebo Fuel 模型清單
# 格式：name（唯一）, uri（Fuel URL）, pose（[x, y, z, roll, pitch, yaw]）
# 座標系與 nav_graph 相同（公尺，原點 = 地圖左上角，Y 往上為正）
#
# 搜尋更多模型：https://app.gazebosim.org/fuel/models
# 新增後跑 rebuild_l1_gazebo_scene.sh 即可同步進 L1.world
  # 使用方式：
  # 1. 去 https://app.gazebosim.org/fuel/models 搜尋模型
  # 2. 點進去後複製頁面上的「Include tag」裡的 URI
  # 3. 貼到下面，格式如下：
  #
  # - name: 唯一名稱（英文，不能有空格）
  #   uri: "https://fuel.gazebosim.org/1.0/{owner}/models/{model_name}"
  #   pose: [x, y, z, roll, pitch, yaw]   # 座標系同 nav_graph（公尺）

# 所有場景家具、設備與人物的預設倍率。
# 建築與導航 overlay 排除；沿用現有流程，機器人也會套用倍率。
scene_scale: [1.4, 1.4, 1.4]

props:
  # 只替換既有模型，保留 Traffic Editor 生成的位置與旋轉；不存在就跳過。
  - name: OpenRobotics/NurseTable
    uri: "model://nurse_station"
    replace_model_only: true

  - name: OpenRobotics/NurseTable_3
    uri: "model://nurse_station"
    replace_model_only: true


  # 電梯使用原尺寸，保留 Traffic Editor 生成的位置。
  - name: hospital_elevator_01
    uri: "model://hospital_elevator_static"
    replace_model_only: true
    scale: [1, 1, 1]

  - name: hospital_elevator_02
    uri: "model://hospital_elevator_static"
    replace_model_only: true
    scale: [1, 1, 1]
