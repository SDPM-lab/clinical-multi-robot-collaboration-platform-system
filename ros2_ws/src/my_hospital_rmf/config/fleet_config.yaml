rmf_fleet:
  name: hospital_fleet
  limits:
    linear:
    - 0.7
    - 0.75
    angular:
    - 0.6
    - 2.0
  profile:
    footprint: 0.35
    vicinity: 0.6
  reversible: true
  battery_system:
    voltage: 24.0
    capacity: 40.0
    charging_current: 8.0
  mechanical_system:
    mass: 70.0
    moment_of_inertia: 40.0
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0
  tool_system:
    power: 0.0
  recharge_threshold: 0.1
  recharge_soc: 0.9
  max_delay: 15.0
  publish_fleet_state: 10.0
  account_for_battery_drain: true
  task_capabilities:
    loop: true
    delivery: true
  finishing_request: nothing
  robots:
    hospital_robot_1:
      charger: charging_station
    hospital_robot_2:
      charger: charging_station
fleet_manager:
  ip: 127.0.0.1
  port: 22013
  user: some_user
  password: some_password
  robot_state_update_frequency: 10.0
